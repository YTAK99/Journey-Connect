name: journey-connect

services:
  db:
    image: postgres:16-alpine
    container_name: journey-connect-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${DB_USERNAME} -d ${DB_NAME}
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - journey-connect-network


  backend:
    build:
      context: .
      dockerfile: jc-backend/Dockerfile

    container_name: journey-connect-backend
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DB_HOST: db
      DB_PORT: 5432
      SERVER_PORT: 8080
      UPLOAD_DIR: /app/uploads/images

    volumes:
      - upload_data:/app/uploads/images

    depends_on:
      db:
        condition: service_healthy

    expose:
      - "8080"

    networks:
      - journey-connect-network


  frontend:
    build:
      context: .
      dockerfile: jc-frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_ADMIN_API_BASE_URL: /api/admin

    container_name: journey-connect-frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "80:80"

    networks:
      - journey-connect-network


volumes:
  postgres_data:
    name: journey-connect-postgres-data

  upload_data:
    name: journey-connect-upload-data


networks:
  journey-connect-network:
    name: journey-connect-network