name: Frontend CI

on:
  push:
    branches:
      - develop
      - youngtak
      - "integration/**"
    paths:
      - "jc-frontend/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_call:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    defaults:
      run:
        working-directory: jc-frontend

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: jc-frontend/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: ESLint 검사
        run: npm run lint

      - name: 외부 API 독립 프론트엔드 경계 테스트
        env:
          VITE_GOOGLE_MAPS_API_KEY: ""
          VITE_GOOGLE_OAUTH_CLIENT_ID: ""
        run: npm run test -- src/services/journeyAiApi.test.js

      - name: 프론트엔드 테스트
        run: npm run test

      - name: 프론트엔드 빌드
        run: npm run build
