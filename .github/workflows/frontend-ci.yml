name: 프론트엔드 CI

on:
  pull_request:
    paths:
      - "jc-frontend/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches:
      - master
      - develop
      - youngin
    paths:
      - "jc-frontend/**"
      - ".github/workflows/frontend-ci.yml"

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: 린트 및 빌드
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: jc-frontend

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: jc-frontend/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: ESLint 검사
        run: npm run lint

      - name: 프로덕션 빌드
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8080/api/v1