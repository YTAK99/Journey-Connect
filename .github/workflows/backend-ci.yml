name: Backend CI

on:
  push:
    branches:
      - youngtak
      - "integration/**"
    paths:
      - "jc-backend/**"
      - ".github/workflows/backend-ci.yml"

  pull_request:
    branches:
      - youngtak
    paths:
      - "jc-backend/**"
      - ".github/workflows/backend-ci.yml"

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_DB: journey_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d journey_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: jc-backend

    env:
      TEST_DB_HOST: localhost
      TEST_DB_PORT: 5432
      TEST_DB_NAME: journey_test
      TEST_DB_USERNAME: postgres
      TEST_DB_PASSWORD: postgres

      JWT_SECRET: journey-connect-ci-secret-key-32bytes-minimum
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      GOOGLE_API_KEY: ci-placeholder
      UPLOAD_DIR: ./build/ci-uploads

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: Java 21 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Gradle 실행 권한 설정
        run: chmod +x gradlew

      - name: CI 애플리케이션 설정 준비
        run: cp src/main/resources/application.yml.sample src/main/resources/application.yml

      - name: 백엔드 테스트
        run: ./gradlew test --no-daemon

      - name: 테스트 결과 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: jc-backend/build/reports/tests/test
          if-no-files-found: ignore