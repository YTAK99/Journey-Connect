name: Backend CI

on:
  push:
    branches:
      - develop
      - youngtak
      - "integration/**"
    paths:
      - "jc-backend/**"
      - "jc-recommendation-core/**"
      - ".github/workflows/backend-ci.yml"
  workflow_call:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_DB: journey_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d journey_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: jc-backend

    env:
      TEST_DB_HOST: localhost
      TEST_DB_PORT: 5432
      TEST_DB_NAME: journey_test
      TEST_DB_USERNAME: postgres
      TEST_DB_PASSWORD: postgres

      JWT_SECRET: journey-connect-ci-secret-key-32bytes-minimum
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      GOOGLE_API_KEY: ci-placeholder
      UPLOAD_DIR: ./build/ci-uploads

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: Java 21 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Gradle 실행 권한 설정
        run: chmod +x gradlew

      - name: CI 애플리케이션 설정 준비
        run: cp src/main/resources/application.yml.sample src/main/resources/application.yml

      - name: 외부 Provider 독립 검증
        env:
          GOOGLE_API_KEY: offline-placeholder
          GOOGLE_AI_API_KEY: ""
          JC_AI_CONTENT_ANALYSIS_ENABLED: "false"
          JC_AI_CONTENT_ANALYSIS_WORKER_ENABLED: "false"
        run: >
          ./gradlew :test --no-daemon
          --tests com.jc.backend.google.GoogleLocationServiceTest
          --tests com.jc.backend.intelligence.contentanalysis.ContentAnalysisRuntimeConfigurationTest
          --tests com.jc.backend.intelligence.contentanalysis.PostContentAnalysisJobWorkerTest
          --tests com.jc.backend.intelligence.journeyai.JourneyAiRuntimeConfigurationTest
          --tests com.jc.backend.intelligence.journeyai.JourneyAiServiceTest

      - name: 백엔드 소비자 테스트
        run: ./gradlew :test --no-daemon

      - name: 실패 테스트 결과 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: jc-backend/build/reports/tests/test
          if-no-files-found: ignore
          retention-days: 7
